<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QuickTools India — Free Online Tools</title>
<meta name="description" content="Free online tools for image, social media, student, calculator and everyday work. Fast and mobile friendly.">
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f8fc;color:#111827}button,input,select,textarea{font:inherit}a{text-decoration:none;color:inherit}.wrap{max-width:1160px;margin:auto;padding:0 16px}.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid #e5e7eb}.navin{height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;font-size:19px;white-space:nowrap}.brand span{color:#2563eb}.links{display:flex;gap:8px;align-items:center}.links a,.btn{border:0;border-radius:11px;padding:10px 13px;background:#eef2ff;color:#1d4ed8;font-weight:700;cursor:pointer}.links a.active,.btn.primary{background:#2563eb;color:#fff}.hero{padding:42px 0 28px;background:linear-gradient(135deg,#eff6ff,#fff 55%,#eef2ff)}.hero h1{font-size:clamp(30px,6vw,54px);line-height:1.05;margin:0 0 12px;letter-spacing:-1.5px}.hero p{font-size:17px;color:#64748b;margin:0 0 22px}.search{display:flex;gap:8px;max-width:760px}.search input{flex:1;min-width:0;border:1px solid #dbe2ea;border-radius:14px;padding:14px 16px;background:#fff;outline:none}.search button{border:0;border-radius:14px;padding:0 20px;background:#111827;color:#fff;font-weight:800}.adslot{min-height:0;margin:18px 0}.adbox{display:none;border:1px dashed #cbd5e1;background:#fff;border-radius:12px;padding:10px;text-align:center;overflow:hidden}.section{padding:28px 0}.section h2{margin:0 0 14px;font-size:25px}.muted{color:#64748b}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:17px;padding:17px;min-width:0;box-shadow:0 5px 20px rgba(15,23,42,.04);transition:.15s}.card:hover{transform:translateY(-2px);box-shadow:0 9px 28px rgba(15,23,42,.08)}.icon{width:43px;height:43px;border-radius:13px;background:#eff6ff;display:grid;place-items:center;font-size:22px;margin-bottom:12px}.card h3{font-size:16px;margin:0 0 6px}.card p{font-size:13px;line-height:1.45;color:#64748b;margin:0 0 13px}.open{display:inline-block;color:#2563eb;font-weight:800;font-size:13px}.cats{display:flex;flex-wrap:wrap;gap:9px}.cat{padding:10px 13px;border:1px solid #e2e8f0;background:#fff;border-radius:999px;cursor:pointer;font-weight:700;color:#334155}.footer{margin-top:30px;padding:30px 0;border-top:1px solid #e5e7eb;color:#64748b}.toolview{display:none;padding:25px 0 50px}.toolhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}.toolhead h1{margin:0;font-size:28px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 5px 20px rgba(15,23,42,.04)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #dbe2ea;border-radius:11px;background:#fff;outline:none}.field textarea{min-height:100px;resize:vertical}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.result{margin-top:16px;padding:15px;border-radius:13px;background:#f8fafc;border:1px solid #e2e8f0}.upload{border:2px dashed #cbd5e1;border-radius:16px;padding:22px;text-align:center;background:#f8fafc}.filepick{display:inline-flex;align-items:center;justify-content:center;padding:12px 16px;border-radius:12px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.filepick input{display:none}.preview{max-width:100%;max-height:430px;border-radius:12px;margin:14px auto 0;display:block}.canvaswrap{overflow:auto;text-align:center}.canvaswrap canvas{max-width:100%;height:auto;border-radius:12px}.statbig{font-size:30px;font-weight:900}.hidden{display:none!important}.notice{padding:12px;border-radius:12px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:13px}.toolsearch{margin:0 0 15px}.empty{text-align:center;padding:30px;color:#64748b;grid-column:1/-1}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.wrap{padding:0 12px}.navin{height:58px}.links a{padding:8px 9px;font-size:12px}.brand{font-size:16px}.hero{padding:30px 0 22px}.search{flex-direction:column}.search button{height:46px}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.toolhead{flex-direction:column}.section{padding:22px 0}.card{padding:15px}}
</style>
</head>
<body>
<header class="nav"><div class="wrap navin"><a class="brand" href="#">QuickTools <span>India</span></a><nav class="links"><a href="#" class="active">Home</a><a href="#tools">All Tools</a></nav></div></header>
<main id="home">
<section class="hero"><div class="wrap"><h1>Free Online Tools for Everyday Work</h1><p>Fast, simple and mobile-friendly tools for images, social media, students and daily tasks.</p><div class="search"><input id="search" placeholder="Search tools…"><button onclick="searchTools()">Search</button></div></div></section>
<div class="wrap"><div id="homeAd" class="adslot"><div class="adbox" id="adHome"></div></div></div>
<section class="section"><div class="wrap"><h2>Popular Tools</h2><div id="popular" class="grid"></div></div></section>
<section class="section" id="tools"><div class="wrap"><h2>All Tools</h2><div class="toolsearch"><input id="toolFilter" class="field" style="width:100%;padding:13px;border:1px solid #dbe2ea;border-radius:12px" placeholder="Filter all tools…" oninput="renderTools()"></div><div id="allTools" class="grid"></div></div></section>
<section class="section"><div class="wrap"><h2>Categories</h2><div id="categories" class="cats"></div></div></section>
</main>
<section id="toolView" class="toolview"><div class="wrap"><div class="toolhead"><div><div class="muted" id="toolCat"></div><h1 id="toolTitle"></h1><p class="muted" id="toolDesc"></p></div><button class="btn" onclick="showHome()">← Back</button></div><div id="toolAd1" class="adslot"><div class="adbox" id="adTool1"></div></div><div id="toolPanel"></div><div id="toolAd2" class="adslot"><div class="adbox" id="adTool2"></div></div><h2 style="margin-top:22px">More useful tools</h2><div id="moreTools" class="grid"></div></div></section>
<footer class="footer"><div class="wrap">© <span id="year"></span> QuickTools India · Free online tools · <a href="#" onclick="alert('Privacy: most tools process files locally in your browser. Files are not uploaded by these tools unless a future feature explicitly says so.')">Privacy</a></div></footer>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
/* ================= FIREBASE CONFIG =================
   Paste your Firebase Web App config here. Admin.html can generate/copy it for you.
*/
const FIREBASE_CONFIG={apiKey:"PASTE_API_KEY",authDomain:"YOUR_PROJECT.firebaseapp.com",databaseURL:"https://YOUR_PROJECT-default-rtdb.firebaseio.com",projectId:"YOUR_PROJECT",storageBucket:"YOUR_PROJECT.appspot.com",messagingSenderId:"YOUR_SENDER_ID",appId:"YOUR_APP_ID"};
const DEFAULT_TOOLS=[
{id:'ratio',name:'Instagram Reel Ratio Checker',cat:'Social Media',icon:'📐',desc:'Check common Instagram/Reel image or video dimensions.',popular:true,keywords:'instagram reel ratio size'},
{id:'dp',name:'WhatsApp DP Maker',cat:'Social Media',icon:'🟢',desc:'Create a square WhatsApp profile image from any photo.',popular:true,keywords:'whatsapp dp profile photo'},
{id:'upi',name:'UPI Screenshot Analyzer',cat:'Finance',icon:'💳',desc:'Inspect an UPI screenshot locally and view basic image details. Not payment verification.',popular:true,keywords:'upi screenshot payment'},
{id:'percent',name:'Exam Percentage Calculator',cat:'Student',icon:'🧮',desc:'Calculate percentage, total and average marks quickly.',popular:true,keywords:'percentage marks exam'},
{id:'passport',name:'Indian Photo Size Maker',cat:'Photo',icon:'🪪',desc:'Resize and crop a photo to common Indian document-photo sizes.',popular:true,keywords:'passport photo indian photo'},
{id:'data',name:'Data Usage Calculator',cat:'Utility',icon:'📶',desc:'Estimate monthly data usage from daily usage.',popular:false,keywords:'data internet gb mb'},
{id:'bio',name:'Instagram Bio Space Generator',cat:'Social Media',icon:'✨',desc:'Generate clean line breaks and spacing for social bios.',popular:false,keywords:'instagram bio space'},
{id:'thumb',name:'YouTube Shorts Thumbnail Maker',cat:'Social Media',icon:'▶️',desc:'Create a 9:16 thumbnail canvas and download it as PNG.',popular:false,keywords:'youtube shorts thumbnail'},
{id:'compress',name:'Image Compressor',cat:'Image',icon:'🗜️',desc:'Compress JPG/PNG/WebP images in your browser and download them.',popular:true,keywords:'compress image jpg png webp'},
{id:'screenshotdp',name:'Screenshot to DP',cat:'Image',icon:'🖼️',desc:'Turn any screenshot into a square DP and download it.',popular:false,keywords:'screenshot dp crop'}
];
let tools=DEFAULT_TOOLS.slice(), settings={ads:{enabled:false,home:'',tool1:'',tool2:''}}, db=null, visitorId='';
function firebaseReady(){return !String(FIREBASE_CONFIG.apiKey).startsWith('PASTE_')&&!String(FIREBASE_CONFIG.projectId).startsWith('YOUR_')}
function initFirebase(){if(!firebaseReady())return;try{if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);db=firebase.database();trackVisitor();loadSettings()}catch(e){console.warn(e)}}
function id(){return crypto&&crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now()}
function today(){return new Date().toISOString().slice(0,10)}
function month(){return today().slice(0,7)}
function trackVisitor(){visitorId=localStorage.getItem('qt_visitor_id')||id();localStorage.setItem('qt_visitor_id',visitorId);const ref=db.ref('analytics/visitors/'+visitorId);const now=Date.now();ref.update({firstSeen:firebase.database.ServerValue.TIMESTAMP,lastSeen:firebase.database.ServerValue.TIMESTAMP,day:today(),month:month(),ua:navigator.userAgent.slice(0,120)}).catch(()=>{});const p=db.ref('analytics/presence/'+visitorId);p.set({lastSeen:firebase.database.ServerValue.TIMESTAMP,day:today()}).catch(()=>{});p.onDisconnect().remove().catch(()=>{});setInterval(()=>p.update({lastSeen:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{}),30000)}
function track(type,tool){if(!db)return;const d=today();const m=month();db.ref('analytics/events/'+d+'/'+id()).set({type,tool:tool||'',ts:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{});db.ref('analytics/days/'+d+'/'+type).transaction(v=>(v||0)+1).catch(()=>{});db.ref('analytics/months/'+m+'/'+type).transaction(v=>(v||0)+1).catch(()=>{})}
function loadSettings(){db.ref('settings').on('value',s=>{settings=s.val()||settings;renderAds()})}
function renderAds(){if(!settings.ads||!settings.ads.enabled)return;['home','tool1','tool2'].forEach(k=>{const el=document.getElementById('ad'+k.charAt(0).toUpperCase()+k.slice(1));if(el&&settings.ads[k]){el.style.display='block';renderCode(el,settings.ads[k])}})}
function renderCode(el,code){el.innerHTML='';const tmp=document.createElement('div');tmp.innerHTML=code;[...tmp.childNodes].forEach(n=>{if(n.nodeName==='SCRIPT'){const s=document.createElement('script');[...n.attributes].forEach(a=>s.setAttribute(a.name,a.value));s.text=n.textContent;el.appendChild(s)}else el.appendChild(n.cloneNode(true))})}
function renderTools(){const q=(document.getElementById('toolFilter').value||'').toLowerCase();const list=tools.filter(t=>(t.name+' '+t.cat+' '+t.desc+' '+(t.keywords||'')).toLowerCase().includes(q));document.getElementById('allTools').innerHTML=list.length?list.map(card).join(''):'<div class="empty">No tool found.</div>'}
function card(t){return `<div class="card"><div class="icon">${t.icon}</div><h3>${esc(t.name)}</h3><p>${esc(t.desc)}</p><a class="open" href="#" onclick="openTool('${t.id}');return false">Open tool →</a></div>`}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function renderHome(){document.getElementById('popular').innerHTML=tools.filter(t=>t.popular).map(card).join('');renderTools();document.getElementById('categories').innerHTML=[...new Set(tools.map(t=>t.cat))].map(c=>`<button class="cat" onclick="filterCat('${esc(c)}')">${esc(c)}</button>`).join('')}
function filterCat(c){document.getElementById('toolFilter').value=c;document.getElementById('tools').scrollIntoView({behavior:'smooth'});renderTools()}
function searchTools(){const q=document.getElementById('search').value.trim();document.getElementById('toolFilter').value=q;document.getElementById('tools').scrollIntoView({behavior:'smooth'});renderTools()}
function showHome(){location.hash='';document.getElementById('home').style.display='block';document.getElementById('toolView').style.display='none';renderHome()}
function openTool(toolId){const t=tools.find(x=>x.id===toolId);if(!t)return;location.hash='tool/'+toolId;document.getElementById('home').style.display='none';document.getElementById('toolView').style.display='block';document.getElementById('toolCat').textContent=t.cat;document.getElementById('toolTitle').textContent=t.name;document.getElementById('toolDesc').textContent=t.desc;document.getElementById('toolPanel').innerHTML=toolHTML(toolId);document.getElementById('moreTools').innerHTML=tools.filter(x=>x.id!==toolId).slice(0,4).map(card).join('');track('tool_open',toolId);renderAds()}
function toolHTML(x){if(x==='ratio')return `<div class="panel"><div class="formgrid"><div class="field"><label>Width (px)</label><input id="rw" type="number" value="1080"></div><div class="field"><label>Height (px)</label><input id="rh" type="number" value="1920"></div></div><div class="actions"><button class="btn primary" onclick="ratioCalc()">Check Ratio</button></div><div id="rr" class="result">Recommended Reel/Shorts ratio: <b>9:16</b></div></div>`;
if(x==='dp'||x==='screenshotdp')return `<div class="panel"><div class="upload"><label class="filepick">Choose photo<input id="imgfile" type="file" accept="image/*" onchange="previewImage(this,'imgprev')"></label><div id="imgprev"></div></div><div class="actions"><button class="btn primary" onclick="makeSquare('${x}')">Create Square DP & Download</button></div></div>`;
if(x==='upi')return `<div class="panel"><div class="notice">This tool only analyzes the image file locally. It cannot confirm whether a UPI payment is genuine or successful.</div><div class="upload" style="margin-top:12px"><label class="filepick">Choose UPI screenshot<input id="upifile" type="file" accept="image/*" onchange="analyzeUPI(this)"></label><div id="upires"></div></div></div>`;
if(x==='percent')return `<div class="panel"><div class="formgrid"><div class="field"><label>Total marks</label><input id="pt" type="number" value="500"></div><div class="field"><label>Obtained marks</label><input id="po" type="number" value="400"></div></div><div class="actions"><button class="btn primary" onclick="percentCalc()">Calculate</button></div><div id="pr" class="result">80%</div></div>`;
if(x==='passport')return `<div class="panel"><div class="formgrid"><div class="field"><label>Width (mm)</label><input id="pw" type="number" value="35"></div><div class="field"><label>Height (mm)</label><input id="ph" type="number" value="45"></div><div class="field"><label>DPI</label><input id="pd" type="number" value="300"></div></div><div class="upload" style="margin-top:12px"><label class="filepick">Choose photo<input id="pfile" type="file" accept="image/*" onchange="previewImage(this,'pprev')"></label><div id="pprev"></div></div><div class="actions"><button class="btn primary" onclick="makePassport()">Resize & Download JPG</button></div></div>`;
if(x==='data')return `<div class="panel"><div class="formgrid"><div class="field"><label>Daily mobile data (MB)</label><input id="dm" type="number" value="500"></div><div class="field"><label>Days</label><input id="dd" type="number" value="30"></div></div><div class="actions"><button class="btn primary" onclick="dataCalc()">Calculate</button></div><div id="dr" class="result"></div></div>`;
if(x==='bio')return `<div class="panel"><div class="field"><label>Enter your bio</label><textarea id="biotxt" placeholder="Line 1\nLine 2\nLine 3"></textarea></div><div class="actions"><button class="btn primary" onclick="bioMake()">Generate & Copy</button></div><div id="bior" class="result"></div></div>`;
if(x==='thumb')return `<div class="panel"><div class="upload"><label class="filepick">Choose image<input id="tfile" type="file" accept="image/*" onchange="previewImage(this,'tprev')"></label><div id="tprev"></div></div><div class="actions"><button class="btn primary" onclick="makeCanvas('tfile',1080,1920,'Shorts Thumbnail')">Create 1080×1920 PNG</button></div></div>`;
if(x==='compress')return `<div class="panel"><div class="formgrid"><div class="field"><label>Quality (10–100)</label><input id="cq" type="number" min="10" max="100" value="75"></div><div class="field"><label>Max width (px)</label><input id="cw" type="number" value="1600"></div></div><div class="upload" style="margin-top:12px"><label class="filepick">Choose image<input id="cfile" type="file" accept="image/*"></label></div><div class="actions"><button class="btn primary" onclick="compressImage()">Compress & Download</button></div><div id="cres" class="result"></div></div>`;return ''}
function fileOf(id){return document.getElementById(id)?.files?.[0]}
function previewImage(input,target){const f=input.files[0];if(!f)return;const u=URL.createObjectURL(f);document.getElementById(target).innerHTML=`<img class="preview" src="${u}">`}
function ratioCalc(){const w=+rw.value,h=+rh.value;if(!w||!h)return;const r=w/h;rr.innerHTML=`Your ratio: <b>${w}:${h}</b> ≈ <b>${r.toFixed(3)}</b><br>Reel/Shorts recommended: <b>9:16 (0.5625)</b>`;track('tool_action','ratio')}
function percentCalc(){const t=+pt.value,o=+po.value;pr.innerHTML=t>0?`<b>${(o/t*100).toFixed(2)}%</b> — ${o} / ${t}`:'Enter valid marks';track('tool_action','percent')}
function dataCalc(){const mb=(+dm.value||0)*(+dd.value||0);dr.innerHTML=`Monthly estimate: <b>${mb.toFixed(0)} MB</b> ≈ <b>${(mb/1024).toFixed(2)} GB</b>`;track('tool_action','data')}
function bioMake(){const s=biotxt.value.replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean).join('\n\u200B');bior.textContent=s||'Enter text';navigator.clipboard?.writeText(s).catch(()=>{});track('tool_action','bio')}
function analyzeUPI(input){const f=input.files[0];if(!f)return;const im=new Image();im.onload=()=>{upires.innerHTML=`<div class="result"><b>Image details</b><br>File: ${esc(f.name)}<br>Size: ${(f.size/1024).toFixed(1)} KB<br>Dimensions: ${im.naturalWidth} × ${im.naturalHeight}px<br>Type: ${esc(f.type||'unknown')}<br><br><span class="muted">No payment verification is performed.</span></div>`;URL.revokeObjectURL(im.src)};im.src=URL.createObjectURL(f);track('tool_action','upi')}
function loadImg(id){return new Promise((res,rej)=>{const f=fileOf(id);if(!f)return rej();const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(f)})}
async function makeSquare(tool){try{const im=await loadImg('imgfile');const c=document.createElement('canvas'),s=Math.min(im.naturalWidth,im.naturalHeight),x=(im.naturalWidth-s)/2,y=(im.naturalHeight-s)/2;c.width=c.height=1080;c.getContext('2d').drawImage(im,x,y,s,s,0,0,1080,1080);download(c.toDataURL('image/jpeg',.92),'quicktools-dp.jpg');track('download',tool)}catch(e){alert('Please choose a photo first.')}}
async function makePassport(){try{const im=await loadImg('pfile'),dpi=+pd.value||300,w=Math.round((+pw.value/25.4)*dpi),h=Math.round((+ph.value/25.4)*dpi),c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d'),src=Math.min(im.naturalWidth/im.naturalHeight,w/h),sw=src>1?w*im.naturalHeight/im.naturalWidth:im.naturalWidth,sh=src>1?im.naturalHeight:im.naturalWidth*w/h,x=(im.naturalWidth-sw)/2,y=(im.naturalHeight-sh)/2;ctx.drawImage(im,x,y,sw,sh,0,0,w,h);download(c.toDataURL('image/jpeg',.92),'indian-photo.jpg');track('download','passport')}catch(e){alert('Please choose a photo first.')}}
async function makeCanvas(fileid,w,h,label){try{const im=await loadImg(fileid),c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d'),scale=Math.max(w/im.naturalWidth,h/im.naturalHeight),sw=im.naturalWidth*scale,sh=im.naturalHeight*scale;ctx.drawImage(im,(w-sw)/2,(h-sh)/2,sw,sh);download(c.toDataURL('image/png'),'shorts-thumbnail.png');track('download','thumb')}catch(e){alert('Please choose an image first.')}}
async function compressImage(){try{const f=fileOf('cfile');if(!f)throw 0;const im=await loadImg('cfile'),max=+cw.value||1600,q=Math.min(1,Math.max(.1,(+cq.value||75)/100)),scale=Math.min(1,max/im.naturalWidth),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*scale);c.height=Math.round(im.naturalHeight*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const url=c.toDataURL('image/jpeg',q);const kb=Math.round(url.length*.75/1024);cres.innerHTML=`Compressed image ready: approx <b>${kb} KB</b>`;download(url,'compressed-image.jpg');track('download','compress')}catch(e){alert('Please choose an image first.')}}
function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}
function handleHash(){const h=location.hash.slice(1);if(h.startsWith('tool/'))openTool(h.slice(5));else showHome()}
document.getElementById('year').textContent=new Date().getFullYear();renderHome();initFirebase();window.addEventListener('hashchange',handleHash);handleHash();
</script>
</body></html>
